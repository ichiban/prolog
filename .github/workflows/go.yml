name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./... -race -coverprofile=coverage.txt -covermode=atomic

    # Examples are separate modules, so ./... above doesn't reach them.
    - name: Build examples
      run: |
        for m in examples/*/; do
          (cd "$m" && go build -v ./... && go vet ./...)
        done

    - name: Codecov
      uses: codecov/codecov-action@v2.1.0
